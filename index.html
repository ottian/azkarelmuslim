<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/azkarelmuslim/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="إذاعة أذكار المسلم">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="أذكار المسلم">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>إذاعة أذكار المسلم</title>
  <meta name="theme-color" content="#110E0B">
  <!--
    على الآيفون: الصفحة متتحركش ولا تتكبّر، علشان مكان اللمس يفضل هو نفس
    مكان الزرار. Safari بيكبّر الصفحة لما تكتب في خانة بحث، وبيزقها لفوق لما
    الكيبورد يطلع ومبيرجعهاش، وساعتها كل ضغطة بتروح في حتة تانية.
  -->
  <style>
    html,body{background:#110E0B;margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
    body{position:fixed;inset:0;touch-action:manipulation}
  </style>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // لو Safari زق الصفحة (بعد الكيبورد مثلا) نرجّعها مكانها
    (function () {
      var reset = function () {
        if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
        if (document.scrollingElement) document.scrollingElement.scrollTop = 0;
      };
      var later = function () { setTimeout(reset, 60); setTimeout(reset, 350); };
      window.addEventListener('scroll', reset, { passive: true });
      document.addEventListener('focusout', later, true);
      if (window.visualViewport) window.visualViewport.addEventListener('resize', later);
      window.addEventListener('orientationchange', later);
    })();
  </script>
  <script>
    // التطبيق يفتح من غير نت، والسور المحفوظة تشتغل (web/sw.js)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('sw', e); });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

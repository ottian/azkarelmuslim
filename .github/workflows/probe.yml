name: Probe
on:
  push:
    branches: [probe/cors]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          for u in https://cdn.mp3quran.net/audio/mahmoud-husary/r5/001.mp3; do
            echo "== GET $u"; curl -s -D - -o /dev/null -H "Origin: https://ottian.github.io" "$u" | head -30
            echo "== OPTIONS"; curl -s -D - -o /dev/null -X OPTIONS -H "Origin: https://ottian.github.io" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: range" "$u" | head -20
            echo "== RANGE"; curl -s -D - -o /dev/null -H "Range: bytes=0-99" -H "Origin: https://ottian.github.io" "$u" | head -20
          done

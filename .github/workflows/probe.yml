name: Probe
on:
  push:
    branches: [probe/media]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: python3 scripts/fetch_media.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -f app/assets/audio app/android/app/src/main/res/raw server/photos
          git commit -m "media"
          git push
